# Content spec for `iig3d.py prompt|render --spec <this>`; Claude writes one of these per infographic.
title: OPENWIKI REFRESH PIPELINE
subtitle: Five steps from commit to published wiki
language: en                      # text language for all labels
layout: linear-progression        # optional: a general layout or a 3d-* device name (a refs/ folder)
style: industrial-3d              # optional: industrial-3d (route by layout), a 3d-* member, or a ref id/file of the layout member (e.g. 06)
aspect: landscape                 # optional: landscape | portrait | square | W:H (snapped to the Gemini set)
quality: 2K                       # optional: 1K | 2K | 4K, the gemini-3-pro-image image_size (one model for every level)
# palette_css: ./brand.css        # optional: brand colours replace the item colours only
# palette_vars: [--brand-primary, --brand-secondary]
# icon_pack: lucide              # optional: Iconify pack; item icons then name a glyph (rocket, or tabler:rocket) copied from an icon sheet
items:                            # one per step, tier, capsule, pill, cell, plate or cylinder
  - label: COMMIT
    detail: Developer pushes to main
    # icon: git-branch             # free-text hint; with icon_pack set, an Iconify glyph name
  - label: TRIGGER
    detail: Scheduled GitHub Action starts
  - label: ANALYSE
    detail: Gemini reads changed source files
  - label: GENERATE
    detail: Wiki pages regenerated
  - label: PUBLISH
    detail: Pages committed to openwiki/
# stats:
#   - {value: "73%", caption: pages refreshed per run}
# notes: keep the world map faint
# pin: 3d-capsule-hub/06         # optional: same as layout: 3d-capsule-hub + style: 06; `refs --member M` lists refs
# refs: [./my-brand-reference.jpg]
