name: 3d-arrow-ribbon
device: Fat 3D chevron arrows and folded ribbons carrying a sequence
backdrop: Light studio, dotted world map
items: {min: 5, max: 8}
aspect_default: landscape
layout:
  structure:
    - Single flow of chevron arrows nesting point-into-notch, left to right
    - One arrow per step, coloured in order
    - Flow rises, dips or curves; never a flat bar
    - Labels hang off thin leader lines alternating above and below the flow
    - Optional spurs leaving an arrow for side outputs
    - Optional goal marker at the end of the flow
  variants:
    - {name: Chevron flow, focus: "Pipelines, journeys, momentum", emphasis: "Interlocking arrows, gradient along the flow"}
    - {name: Folded ribbon tiers, focus: "Stacked stages, funnels", emphasis: Angled bands stacked vertically with hexagon tabs}
  visual_elements:
    - Arrows with visible thickness, top faces lighter, side faces darker
    - One flat icon or numeral riding on each arrow top face
    - Leader lines with dot terminals to text blocks
    - Thin parallel rail under the flow for cross-cutting items
    - "Ribbon variant: hexagon letter tab and slim chevron pointer per band"
  text_placement:
    - Title at top
    - Step names above the flow, detail lines below, alternating per arrow
    - Rail labels along the rail
    - Flow spans 85 to 90 percent of the canvas width
    - Landscape only for the chevron variant
style:
  palette:
    - Family item colours applied as a smooth gradient along the flow (purple, blue, teal, green) or as discrete blocks per arrow
    - Light studio backdrop with an optional dotted world map at 5 to 8 percent opacity
    - Arrow top faces lighter, side faces darker, giving the chevrons visible thickness
  visual_elements:
    - Chevron arrows nest into each other, the point of one entering the notch of the next
    - The flow rises, dips or curves; it is never a flat straight bar
    - One flat icon per arrow sits on the top face, in white or in the arrow colour
    - Leader lines drop from each icon to a text block alternating above and below the flow
    - "Ribbon variant: angled folded bands stacked vertically, each with a hexagon tab and a slim chevron pointer to an icon"
    - Optional small figure or object at the end of the flow as the goal marker
  typography:
    - Family typography; step names bold caps, descriptions light charcoal in two to four short lines
    - Title top-centre, two-tone (bold word plus light word)
  composition:
    - Landscape only for the chevron variant; the flow spans 85 to 90 percent of the width
    - Five to eight arrows; fewer than five, use 3d-disc-timeline
    - Text blocks alternate above and below so no two adjacent labels collide
    - Ribbon variant works in portrait and square
prompt_fragment: >-
  Render as a polished corporate 3D infographic whose spine is one continuous flow of fat glossy 3D chevron arrows: each arrow is one step, nesting point-into-notch with the next, sweeping left to right with a gentle rise or curve, top faces lighter and side faces darker to show thickness. Colours run in order along the flow from purple through royal blue and teal to lime green (or one saturated colour per arrow). A flat white icon rides on each arrow; a thin leader line with a dot terminal drops to its label, alternating above and below the flow. Light off-white studio backdrop with a faint dotted world map. Geometric sans-serif: bold all-caps step names, light charcoal descriptions, two-tone title. No hand-drawn lines, no paper texture, no cartoon characters, no photographic realism, no watermarks, no placeholder text. Clean premium business-template 3D.
best_for:
  - Process flows with momentum
  - Transformation journeys and pipelines
  - Problem-to-solution paths
  - Growth narratives
refs:
  - id: "01"
    file: ref-01-chevron-arrow-flow.jpg
    shows: Eight interlocking 3D chevron arrows sweeping left to right in a purple to green gradient, icons on each arrow, leader lines to text above and below, dotted world map backdrop
    flags: [clean]
  - id: "02"
    file: ref-02-folded-ribbon-tiers.jpg
    shows: Five angled folded ribbon bands A to E, monochrome blue, hexagon letter tabs, icon column at right
    flags: [clean]
pairings:
  linear-progression: ["01"]
  bridge: ["01"]
  funnel: ["02"]
  story-mountain: ["01"]
alternates: [3d-disc-timeline, 3d-slab-stack]
