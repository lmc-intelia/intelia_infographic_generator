name: 3d-soft-emboss
device: 'Neumorphic soft-embossed grey devices: jigsaw ring, segment ring, overlapping circles, chevron row, hexagon clusters,
  pill and card lists, ring chains, hub spokes, all pressed into a matte grey field'
backdrop: Matte light grey
items:
  min: 3
  max: 6
aspect_default: landscape
layout:
  structure:
  - One ring device 55 to 70 percent of the canvas height, on the right or centred
  - 'Jigsaw ring: a disc cut into three or four puzzle pieces with knob-and-socket edges, one icon disc per piece'
  - 'Segment ring: a disc cut into three or four wedges by thin grooves, one icon disc per wedge'
  - 'Overlapping circles: three translucent circles overlapping like a Venn, numerals in the overlaps, icon disc on each outer
    lobe'
  - Numbered text cards or big numerals in a column beside the device, one per item
  - Chevron row: five or six raised chevron arrows nesting left to right in one row, numeral and name on each, a raised icon
      disc with a caption under each chevron
  - 'Hexagon devices: raised hexagons in columns or an arc, connected to a centre disc by thin lines with end dots'
  - 'List devices: raised icon discs or numeral tiles beside rounded pill or card text blocks, in one or two columns'
  - 'Hub devices: one large centre disc with spokes or brackets to raised icon discs, text beside each'
  variants:
  - name: Jigsaw ring
    focus: Parts that lock into one whole
    emphasis: Puzzle-cut disc, pieces separated by fine grooves
  - name: Segment ring
    focus: Cycles and phases
    emphasis: Wedge-cut disc around a recessed centre
  - name: Overlapping circles
    focus: Shared ground between three areas
    emphasis: Three raised circles with numerals in the overlaps
  - name: Chevron row
    focus: Sequences of five or six steps
    emphasis: Raised chevrons in a row with one rolled glossy edge each and flat gaps between, icon discs and captions beneath,
      title between thin rules
  - name: Hex cluster
    focus: Six capabilities around one core
    emphasis: Two columns of three raised hexagons flanking a central ring disc, thin connectors with end dots
  - name: Tile grid
    focus: Six numbered points at a glance
    emphasis: Numeral hexagon tile beside a rounded text card, two columns of three
  - name: Pill list
    focus: Three to four points read top to bottom
    emphasis: Raised icon discs in a column with a rounded pill card beside each, optionally inside one large raised panel
  - name: Numbered cards
    focus: Three ordered points with equal weight
    emphasis: Rounded cards each carrying a large numeral, name and detail, in a row or a column, icon disc optional
  - name: Ring chain
    focus: Five linked stages
    emphasis: Raised ring nodes joined by one zigzag band, icon in each ring, labels alternating above and below
  - name: Capsule row
    focus: Four parallel pillars
    emphasis: Tall capsules in a row, white icon disc at the top of each, name and detail inside
  - name: Hex arc hub
    focus: Five satellites around one centre
    emphasis: Hexagon tiles in an arc left of a large centre disc, dotted connectors and small ring nodes
  - name: Bar stack
    focus: Three stages with icon and numeral
    emphasis: Stacked rounded bars, each with a raised icon sphere and a numeral ring, sides alternating
  - name: Step branches
    focus: Three steps from one centre
    emphasis: Large centre disc left, step rings on a vertical stem, each with a header tab and a text bar
  - name: Arrow bars
    focus: Four ranked measures
    emphasis: Half disc left, arrow bars stacked with name and numeral, icon ring and percentage to the right
  - name: Hub spokes
    focus: Three pillars from one hub
    emphasis: Centre disc or title with straight or bracket connectors to a column of raised icon discs, text beside each
  - name: Lettered discs
    focus: Four lettered options
    emphasis: Raised discs with big letters resting on U cradles, stems down to text blocks
  visual_elements:
  - Every shape is the same light grey as the backdrop, raised by a soft light-top-left shadow and a darker bottom-right shadow
  - Icon discs raised a second level above the piece, dark grey flat icons
  - Recessed centre disc on the ring devices
  - 'Text cards: raised rounded rectangles with a large light-grey numeral and dark text'
  - No colour, no outlines, no gloss; depth comes from shadow only
  text_placement:
  - Title centred at top between two thin rules
  - Item numerals 01 to 04 large and light grey on the cards or beside the device
  - Item name bold caps in dark grey, description light grey below
  - No text on the device except numerals in the overlaps
style:
  palette:
  - 'Monochrome: field and shapes #E6E8EB, highlight shadow white at 80 percent, low shadow #B9BEC5, icons and text #4A4F57'
  - A brand colour override tints only the icons and item names; shapes stay grey
  visual_elements:
  - Ring device 55 to 70 percent of the canvas height, edge shadows 3 to 5 percent of its diameter
  - Grooves between pieces as thin dark-then-light shadow pairs
  - Icon discs raised, 14 to 18 percent of the device diameter, flat dark icons
  - Text cards raised the same way, aligned in one column
  - Matte finish everywhere; no gloss highlights
  typography:
  - Family typography; numerals thin and large in light grey, names bold caps dark grey, body light grey
  composition:
  - 'Landscape: device right, cards left (ref 01) or device centred with items either side (ref 02)'
  - 'Three items: segment ring or overlapping circles; four items: jigsaw or segment ring'
  - Five or six items: chevron row, landscape only
  - More than six items, switch to 3d-paper-tile or 3d-capsule-hub
  - 'Six items: hex cluster or tile grid; five items: ring chain or hex arc hub'
  - 'Portrait or square sources: pill list, framed pill list or bar stack'
prompt_fragment: 'Render as a polished corporate 3D infographic in a neumorphic soft-embossed style: every shape is the same
  matte light grey as the backdrop and stands out only through a soft white highlight at the top left and a darker shadow
  at the bottom right. One ring device, a disc cut into puzzle pieces or wedges, or three overlapping raised circles, with
  a raised icon disc on each part and a recessed centre. Numbered raised text cards beside it. No colour, no outlines, no
  gloss. Geometric sans-serif type in dark grey. No hand-drawn lines, no paper texture, no cartoon characters, no photographic
  realism, no watermarks, no placeholder or lorem ipsum text. Clean premium business-template 3D.'
best_for:
- Three or four part frameworks
- Cycles with few phases
- Shared responsibilities and overlaps
- Understated monochrome decks
alternates:
- 3d-paper-tile
- 3d-capsule-hub
- 3d-triangle-plate
