[project]
name = "iig3d-dev"
version = "0.2.0"
description = "Development environment for the iig3d Claude Code skill (3D corporate infographics)"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pre-commit>=4",
    "ruff>=0.6",
    "bandit[toml]>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 240
target-version = "py310"
extend-exclude = ["sdlc/", "graphify-out/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PTH", "RUF"]
ignore = ["S101", "S603", "S607", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.bandit]
targets = ["skills/iig3d/scripts"]
exclude_dirs = ["tests", ".venv", "sdlc", "graphify-out"]
skips = ["B101"]
