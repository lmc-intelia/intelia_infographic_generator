[project]
name = "iig3d-dev"
version = "0.1.0"
description = "Development environment for the iig3d Claude Code skill (3D corporate infographics)"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
